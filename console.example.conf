#
# DVM Management CLI Configuration File
#
# This file configures the dvm_mgmt tool with paths, ports, and system settings.
# Copy this file to /opt/console.conf and customize for your environment.

# ============================================================================
# API Configuration
# ============================================================================

# System REST API Configuration
SYSTEM_PORT=9290
SYSTEM_ACL="RPT1234"

# API Host (typically localhost)
API_HOST="127.0.0.1"

# Enable browser System Watch page and websocket relay
# Set to 0/false/no/off to disable
SYSTEM_WATCH_ENABLED=1

# Upstream websocket endpoint used by the browser System Watch page
SYSTEM_WATCH_WEBSOCKET_URL="ws://127.0.0.1:8443"

# ============================================================================
# Federation Configuration
# ============================================================================

# Enable multi-system federation view in the web UI
# When enabled, browser requests still hit local API only; local API proxies to selected remote.
FEDERATION_ENABLED=0

# Identifier for this node when calling remote federation peers
FEDERATION_NODE_ID="local"

# Single global shared secret used for server-to-server request signing
# Keep this long and random; must match on all federated nodes.
FEDERATION_SHARED_SECRET=""

# Remote federation API timeout (seconds)
FEDERATION_TIMEOUT_SEC=8

# Verify TLS certificates for federation upstream requests
FEDERATION_TLS_VERIFY=1

# Federation auth freshness window in seconds
FEDERATION_AUTH_WINDOW_SEC=30

# Remote nodes (indexed). Add as many FEDERATION_NODE_N_* blocks as needed.
# FEDERATION_NODE_1_ID="site-a"
# FEDERATION_NODE_1_NAME="Site A"
# FEDERATION_NODE_1_URL="https://10.0.1.10:8080"
# FEDERATION_NODE_1_ENABLED=1

# ============================================================================
# File Paths
# ============================================================================

# Talkgroup ACL Files
SYSTEM_TGID_ACL_FILE="/opt/dvm/talkgroup_rules.yml"

# Radio ID ACL Files (CSV format)
SYSTEM_RID_ACL_FILE="/opt/dvm/rid_acl.dat"

# Peer ID ACL Files
SYSTEM_PEERID_ACL_FILE="/opt/dvm/peer_list.dat"

# Adjacent Site Map File
ADJ_SITE_MAP_FILE="/opt/dvm/adj_site_map.yml"

# ============================================================================
# Binary Paths
# ============================================================================

# DVM binaries directory
DVM_BIN_PATH="/opt/dvm/bin"

# Optional: Override specific binary paths
# TGED_PATH="/opt/dvm/bin/tged"
# PEERED_PATH="/opt/dvm/bin/peered"

# ============================================================================
# Log Configuration
# ============================================================================

# Log directory for DVM logs
LOG_DIR="/var/log/dvm"

# System log file to search for call records
LOG_FILE="/var/log/syslog"

# Log prefixes for filtering call records
# These are the identifiers in syslog that distinguish between system types
LOG_PREFIX_SYSTEM="SKYN-FNE1-CR1"
