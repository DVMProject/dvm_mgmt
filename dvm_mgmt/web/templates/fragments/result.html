<!-- fragments/result.html — inline result for radio commands -->
<div class="mt-3 px-4 py-3 rounded-lg border text-sm
     {% if pending %}
       bg-blue-900/30 border-blue-700/50 text-blue-400
     {% elif success %}
       bg-green-900/30 border-green-700/50 text-green-400
     {% else %}
       bg-red-900/30 border-red-700/50 text-red-400
     {% endif %}">
    <div class="flex items-start gap-2">
        {% if pending %}
        <svg class="w-4 h-4 mt-0.5 shrink-0 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        {% elif success %}
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {% else %}
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        {% endif %}
        <div>
            <p class="font-medium">{{ message }}</p>
            {% if detail and not success %}
            <p class="text-xs mt-1 opacity-70">{{ detail.get('error', '') }}</p>
            {% endif %}
        </div>
    </div>
    {% if pending and operation_id %}
    <div hx-get="/api/radio/operation/{{ operation_id }}" hx-trigger="load delay:1s" hx-target="closest div.mt-3"
        hx-swap="outerHTML"></div>
    {% endif %}
</div>
