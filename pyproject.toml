[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvm-mgmt"
version = "1.0.0"
description = "DVM Management - Unified CLI and TUI Management Tools"
authors = [{name = "DVMProject Authors"}]
license = {text = "PROPRIETARY"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "cmd2>=3.1.2",
    "fastapi==0.92.0",
    "jinja2>=3.1.0",
    "python-pam>=2.0.2",
    "textual>=0.47.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pydantic>=1.10,<2.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "uvicorn==0.17.6",
    "itsdangerous==2.1.2",
    "aiofiles==23.1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
run = "dvm_mgmt.__main__:main"
run-cli = "dvm_mgmt.cli.cisco_cli:main"
run-web = "dvm_mgmt.web.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dvm_mgmt*"]

[tool.setuptools.package-data]
dvm_mgmt = ["web/templates/**/*.html", "web/static/**/*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py38"
